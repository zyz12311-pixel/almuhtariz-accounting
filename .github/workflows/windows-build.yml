name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - run: npm ci
      - run: npm run build:zatca-deps
      - shell: pwsh
        run: |
          & ./tools/build-zatca-xmlsec.ps1 -JavaHome $env:JAVA_HOME
          if ($LASTEXITCODE -ne 0) { throw 'Java compilation failed' }
          $lib = (Resolve-Path tools/zatca-lib).Path
          $jars = (Get-ChildItem $lib -Filter '*.jar' -File).FullName
          $cp = $jars -join ';'
          "ZATCA_XMLSEC_CLASSPATH=$cp" >> $env:GITHUB_ENV
          "ZATCA_JAVA=$env:JAVA_HOME\bin\java.exe" >> $env:GITHUB_ENV
          $helpers = (Resolve-Path server/zatca/java/build).Path
          '<root b="2" a="1"/>' | & "$env:JAVA_HOME\bin\java.exe" -cp "$helpers;$cp" C14n11 subtree
          if ($LASTEXITCODE -ne 0) { throw 'Canonicalization smoke test failed' }
      - run: npm test
