name: Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - run: npm ci
      - shell: pwsh
        run: |
          $run = [int]$env:GITHUB_RUN_NUMBER
          $attempt = [int]$env:GITHUB_RUN_ATTEMPT
          if ($attempt -ge 100 -or $run -gt 655) { throw 'Build version range exhausted' }
          $version = "0.10.$($run * 100 + $attempt)"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          npm version $version --no-git-tag-version --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Version stamping failed' }
      - run: npm run build:zatca-deps
      - shell: pwsh
        run: |
          & ./tools/build-zatca-xmlsec.ps1 -JavaHome $env:JAVA_HOME
          $stage = New-Item -ItemType Directory -Force installer-stage
          foreach ($dir in @('server','web','node_modules','tools')) {
            Copy-Item $dir $stage.FullName -Recurse
          }
          Copy-Item package.json,package-lock.json,installer/start.cmd $stage.FullName
          $runtime = New-Item -ItemType Directory -Force "$stage/runtime"
          Copy-Item (Get-Command node.exe).Source "$runtime/node.exe"
          Copy-Item $env:JAVA_HOME "$runtime/java" -Recurse
          if (!(Test-Path "$runtime/java/bin/java.exe")) { throw 'Missing bundled Java' }
          if (Get-ChildItem $stage -Recurse -File -Include '*.pfx','*.p12','*.db','*.key','credentials*.json','csid*.json','zatca-einvoicing-sdk-*.jar') { throw 'Unexpected sensitive or SDK file in package' }
      - shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/desktop-tools" --no-audit --no-fund --save-exact electron@39.8.5 rcedit@4.0.1
          if ($LASTEXITCODE -ne 0) { throw 'Electron dependency installation failed' }
          Copy-Item "$env:RUNNER_TEMP/desktop-tools/node_modules/electron/dist/*" installer-stage -Recurse -Force
          Rename-Item installer-stage/electron.exe Almuhtariz.exe
          New-Item -ItemType Directory -Force installer-stage/resources/app | Out-Null
          Copy-Item installer/desktop.cjs installer-stage/resources/app/main.cjs
          @{name='almuhtariz-desktop';version=$env:APP_VERSION;main='main.cjs'} | ConvertTo-Json -Compress | Set-Content installer-stage/resources/app/package.json -Encoding ascii
          python -m pip install Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Icon tool installation failed' }
          python -c "from PIL import Image; Image.open('web/assets/almuhtariz-logo.png').convert('RGBA').resize((256,256)).save('installer-stage/app.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          if ($LASTEXITCODE -ne 0) { throw 'Icon conversion failed' }
          $editor = Get-ChildItem "$env:RUNNER_TEMP/desktop-tools/node_modules/rcedit" -Recurse -Filter rcedit-x64.exe | Select-Object -First 1
          if (!$editor) { throw 'Missing icon resource editor' }
          & $editor.FullName installer-stage/Almuhtariz.exe --set-icon installer-stage/app.ico --set-file-version $env:APP_VERSION --set-product-version $env:APP_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Executable icon update failed' }
      - shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' } }
          & $iscc "/DAppBuildVersion=$env:APP_VERSION" installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Almuhtariz-install-test'
          $p = Start-Process "dist/Al-Muhtariz-Accounting-Setup-$env:APP_VERSION.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit $($p.ExitCode)" }
          $pkg = Get-Content "$target/package.json" -Raw | ConvertFrom-Json
          $desktopPkg = Get-Content "$target/resources/app/package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne $env:APP_VERSION -or $desktopPkg.version -ne $env:APP_VERSION) { throw 'Installed version mismatch' }
          $env:ALMUHTARIZ_DATA = Join-Path $env:RUNNER_TEMP 'Almuhtariz-test-data'
          $env:ZATCA_JAVA = "$target/runtime/java/bin/java.exe"
          $env:ZATCA_XMLSEC_HELPER_DIR = "$target/server/zatca/java/build"
          $env:ZATCA_XMLSEC_CLASSPATH = (Get-ChildItem "$target/tools/zatca-lib" -Filter '*.jar').FullName -join ';'
          $env:PORT = '19300'
          $cp = "$env:ZATCA_XMLSEC_HELPER_DIR;$env:ZATCA_XMLSEC_CLASSPATH"
          '<root b="2" a="1"/>' | & $env:ZATCA_JAVA -cp $cp C14n11 subtree
          if ($LASTEXITCODE -ne 0) { throw 'Installed Java smoke test failed' }
          $server = Start-Process "$target/runtime/node.exe" -ArgumentList '--no-warnings',"$target/server/index.js" -WorkingDirectory $target -PassThru
          try {
            $ok = $false
            for ($i=0; $i -lt 30; $i++) {
              try { $response = Invoke-WebRequest http://127.0.0.1:19301/ -TimeoutSec 3; if ($response.StatusCode -eq 200) { $ok=$true; break } } catch {}
              Start-Sleep -Seconds 1
            }
            if ($ok) { $health = Invoke-RestMethod http://127.0.0.1:19301/api/health; if ($health.version -ne $env:APP_VERSION) { throw 'Server version mismatch' } }
            if (!$ok -or !(Test-Path "$env:ALMUHTARIZ_DATA/smartz.db")) { throw 'Installed application failed startup' }
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
      - shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Almuhtariz-install-test'
          $desktop = Start-Process "$target/Almuhtariz.exe" -PassThru
          try {
            Start-Sleep -Seconds 15
            $desktop.Refresh()
            if ($desktop.HasExited -or $desktop.MainWindowHandle -eq 0) { throw 'Desktop window did not open' }
          } finally {
            if (!$desktop.HasExited) { $desktop.CloseMainWindow() | Out-Null; if (!$desktop.WaitForExit(15000)) { Stop-Process -Id $desktop.Id -Force; throw 'Desktop shutdown timed out' } }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Al-Muhtariz-Accounting-desktop-test-installer-${{ env.APP_VERSION }}
          path: dist/Al-Muhtariz-Accounting-Setup-${{ env.APP_VERSION }}.exe
          if-no-files-found: error
